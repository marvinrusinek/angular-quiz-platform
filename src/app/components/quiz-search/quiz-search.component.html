<div class="quiz-search" [class.quiz-search--with-icon]="showIcon()">
  @if (showIcon()) {
    <mat-icon
      class="search-icon"
      aria-hidden="true"
    >
      search
    </mat-icon>
  }

  <!-- The input's name is an explicit ARIA reference to this permanent hidden span (always present: empty, typed and
       cleared). It is not a native label/for association, and it is hidden so it is not exposed as separate text. -->
  <span [id]="nameId" hidden i18n>Search quizzes</span>
  <input
    type="text"
    class="search-input"
    [value]="searchTerm()"
    (input)="onInput($any($event.target).value)"
    [attr.aria-labelledby]="nameId"
  />

  @if (!searchTerm() && placeholder()) {
    <span class="search-placeholder" aria-hidden="true">{{ placeholder() }}</span>
  }

  @if (showClear() && searchTerm()) {
    <button
      type="button"
      class="clear-btn"
      (click)="clear()"
      aria-label="Clear search"
      i18n-aria-label
    >
      <mat-icon>close</mat-icon>
    </button>
  }
</div>
