<mat-card-header>
  <button
    #quizLogo
    type="button"
    class="quiz-header__logo"
    (click)="goToSelection()"
    matTooltip="Back to Quiz Selection"
    i18n-matTooltip
    matTooltipPosition="left"
    aria-label="Angular Quiz Platform"
    i18n-aria-label
  >
    <img
      mat-card-avatar
      class="header-image"
      loading="lazy"
      aria-hidden="true"
      alt="Angular Quiz Platform"
      ngSrc="assets/images/angular-quiz-platform-logo.webp"
      width="495"
      height="144"
    />
  </button>

  @if (currentQuiz(); as currentQuiz) {
    <div class="header-titles">
      <h1 mat-card-title i18n>{{ currentQuiz?.milestone || 'No questions found' }} Quiz</h1>

      <h2 mat-card-subtitle i18n>Assess your knowledge of {{ currentQuiz?.milestone || 'No questions found' }}</h2>
    </div>
  }

  <div class="header-actions">
    <button
      type="button"
      class="keyboard-shortcuts-btn"
      (click)="openKeyboardShortcuts()"
      matTooltip="Open keyboard shortcuts"
      i18n-matTooltip
      matTooltipPosition="below"
      aria-label="Open keyboard shortcuts"
      i18n-aria-label
    >
      <mat-icon>keyboard</mat-icon>
    </button>

    <codelab-theme-toggle />
  </div>
</mat-card-header>
