<section class="return">
  <mat-card-actions>
    <mat-nav-list>
      <button
        type="button"
        class="btn hvr-radial-out mdc-button mdc-button--outlined"
        title="restart"
        i18n-title
        (click)="restartQuiz()"
      >
        <div class="mdc-button__ripple"></div>
        <i class="material-icons mdc-button__icon" aria-hidden="true"
          >power_settings_new</i
        >&nbsp;&nbsp;
        <span class="mdc-button__label"><strong i18n>Restart Quiz</strong></span>
      </button>
      <button
        type="button"
        class="btn hvr-radial-out mdc-button mdc-button--outlined"
        title="select quiz"
        i18n-title
        (click)="selectQuiz()"
      >
        <div class="mdc-button__ripple"></div>
        <i class="material-icons mdc-button__icon" aria-hidden="true"
          >select_all</i
        >&nbsp;&nbsp;
        <span class="mdc-button__label"><strong i18n>Select Quiz</strong></span>
      </button>
      <!-- Navigation only; leave this attempt's result and session intact.
           A native button (routerLink="/progress") with one visible label and the existing icon-to-label CSS spacing. -->
      <button
        type="button"
        class="btn hvr-radial-out mdc-button mdc-button--outlined progress-link"
        routerLink="/progress"
      >
        <div class="mdc-button__ripple"></div>
        <i class="material-icons mdc-button__icon" aria-hidden="true">score</i>
        <span class="mdc-button__label"><strong i18n>View Your Progress</strong></span>
      </button>
    </mat-nav-list>
  </mat-card-actions>
</section>
